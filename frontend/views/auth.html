<div class="auth-view-wrapper">
    <div class="auth-side-brand">
        <div class="brand-content">
            <h1 class="logo-large">SYNAPSE</h1>
            <p class="tagline">Ecossistema de Inteligência Educacional & Cognição</p>
            <div class="brand-features">
                <div class="feature-item">
                   <div class="feature-icon"><i class='bx bx-brain'></i></div>
                   <div class="feature-text">
                        <strong>IA Generativa</strong>
                        <span>Assistente pedagógico 24/7</span>
                   </div>
                </div>
                <div class="feature-item">
                   <div class="feature-icon"><i class='bx bx-pulse'></i></div>
                   <div class="feature-text">
                        <strong>Neuro-analytics</strong>
                        <span>Métricas de atenção e retenção</span>
                   </div>
                </div>
            </div>
        </div>
        <div class="brand-footer">
            2026 © SYNAPSE • Powered by Orion Engines
        </div>
    </div>

    <div class="auth-form-container">
        <div class="auth-card-modern">
            <div class="auth-header-modern">
                <h2 id="auth-title">Bem-vindo</h2>
                <p id="auth-subtitle">Acesse o portal para continuar sua jornada</p>
            </div>

            <div id="auth-content">
                <div id="state-login" class="auth-state">
                    <form id="form-login" class="modern-form">
                        <div class="input-modern">
                            <i class='bx bx-envelope'></i>
                            <input type="email" id="login-email" required placeholder="E-mail corporativo">
                        </div>
                        <div class="input-modern">
                            <i class='bx bx-lock-alt'></i>
                            <input type="password" id="login-password" required placeholder="Sua senha">
                        </div>
                        <button type="submit" class="btn-primary" id="btn-login-submit">
                            Entrar na Plataforma
                        </button>
                    </form>
                    
                    <div class="auth-footer-links">
                        <a href="#" data-switch="recovery">Perdeu seu acesso?</a>
                        <span>Não tem conta? <a href="#" data-switch="register">Solicitar agora</a></span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
